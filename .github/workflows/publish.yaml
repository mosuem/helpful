name: Publish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@publish-provenance-support
    with:
      provenance: true
    permissions:
      id-token: write
      pull-requests: write
      attestations: write
      contents: read
